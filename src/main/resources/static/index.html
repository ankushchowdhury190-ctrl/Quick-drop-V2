<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="QuickDrop - Upload, share, and manage your files securely.">
  <title>QuickDrop</title>

  <link rel="icon" type="image/png" href="/images/favicon.png">
  <link rel="stylesheet" href="/css/tailwind.css">
  <link rel="stylesheet" href="/css/custom.css">
  <script src="/js/tailwindTheme.js"></script>
</head>

<body class="bg-gray-50 text-gray-800 dark:bg-slate-900 dark:text-gray-100 min-h-screen">
  <nav class="bg-gray-800 dark:bg-gray-900 text-gray-100">
    <div class="max-w-7xl mx-auto px-4 py-4">
      <div class="flex items-center justify-between">
        <a href="/" class="flex items-center space-x-2">
          <img
            src="/images/favicon.png"
            alt="QuickDrop logo"
            class="h-10"
          >
          <span class="font-semibold tracking-tight">QuickDrop</span>
        </a>

        <div class="flex items-center space-x-3">
          <a
            href="/file/list"
            class="nav-menu-item hover:text-white"
          >
            View Files
          </a>

          <button
            type="button"
            class="nav-menu-item theme-toggle rounded-lg p-2 transition-colors hover:bg-sky-600 dark:hover:bg-sky-500"
            aria-label="Toggle theme"
          >
            🌙
          </button>
        </div>
      </div>
    </div>
  </nav>

  <main class="max-w-4xl mx-auto px-4 py-12 md:py-20">
    <section class="bg-white dark:bg-slate-800 rounded-2xl shadow-lg p-8 md:p-12 text-center">
      <img
        src="/images/favicon.png"
        alt="QuickDrop logo"
        class="h-20 w-20 mx-auto mb-6 rounded-xl"
      >

      <h1 class="text-3xl md:text-5xl font-semibold tracking-tight">
        Welcome to QuickDrop
      </h1>

      <p class="mt-4 text-gray-600 dark:text-gray-300">
        Upload, share, and manage your files securely.
      </p>

      <div class="mt-8 flex flex-col sm:flex-row justify-center gap-4">
        <a
          href="/file/upload"
          class="rounded-lg bg-sky-500 hover:bg-sky-600 text-white font-medium px-5 py-3 transition-colors"
        >
          Upload a file
        </a>

        <a
          href="/file/list"
          class="rounded-lg border border-slate-300 dark:border-slate-600 hover:bg-slate-100 dark:hover:bg-slate-700 font-medium px-5 py-3 transition-colors"
        >
          View files
        </a>
      </div>
    </section>
  </main>
</body>
</html>
